<!doctype html>
<html><body style="margin:0;background:#2a2a2a">
<canvas id="c" width="1600" height="400"></canvas>
<script type="module">
// TEMPORARY preview: the textured wedge from four sides.
import * as THREE from 'three';
import { cheeseWedgeGeometry, cheeseWedgeMaterial } from '/src/render/cheeseView.js';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a2a);
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 2, 1.5); scene.add(sun);
const material = cheeseWedgeMaterial(); material.emissiveIntensity = 0;
scene.add(new THREE.Mesh(cheeseWedgeGeometry(0.32, 0.18), material));
const views = [[0.2, 1.2, 0.6], [0.6, 0.35, 1.0], [1.1, 0.3, -0.5], [-0.3, -1.1, -0.4]];
const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 10);
setTimeout(() => {
  views.forEach((p, i) => {
    renderer.setViewport(i * 400, 0, 400, 400); renderer.setScissor(i * 400, 0, 400, 400);
    cam.position.set(...p).multiplyScalar(0.62); cam.lookAt(0, 0, 0);
    renderer.render(scene, cam);
  });
  window.done = true;
}, 1200);
</script></body></html>
